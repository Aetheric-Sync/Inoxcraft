databases:
  - name: inoxcraft-db
    plan: free
    databaseName: inoxcraft
    user: inoxcraft

services:
  - type: web
    name: inoxcraft
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inoxcraft-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: inoxcraft-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: INOXCRAFT
      - key: SKIP_ENV_VALIDATION
        value: "false"

  # Pings the web service every 10 minutes so Render's free tier never sees
  # 15 minutes of inactivity and spins the app down.
  - type: cron
    name: inoxcraft-keepalive
    env: node
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -fsS "https://$APP_HOST/api/health"'
    envVars:
      - key: APP_HOST
        fromService:
          type: web
          name: inoxcraft
          property: host
